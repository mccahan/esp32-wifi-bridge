name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Get Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git describe --always --dirty --tags)
          fi
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "ota_url=https://${OWNER}.github.io/${REPO}/version.json" >> $GITHUB_OUTPUT
          echo "gl_s10_ota_url=https://${OWNER}.github.io/${REPO}/gl-s10/version.json" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"
          echo "OTA URL: https://${OWNER}.github.io/${REPO}/version.json"

      - name: Build Firmware
        run: |
          for i in 1 2 3 4 5; do
            if pio run -e esp32-s3-devkitc-1; then
              exit 0
            fi
            echo "pio run failed (attempt $i), retrying..."
            sleep $((i * 15))
          done
          exit 1
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
          REMOTE_OTA_VERSION_URL: ${{ steps.version.outputs.ota_url }}

      # GL.iNet GL-S10 (original ESP32): its own OTA channel under gl-s10/
      - name: Build GL-S10 Firmware
        run: |
          for i in 1 2 3 4 5; do
            if pio run -e gl-s10; then
              exit 0
            fi
            echo "pio run failed (attempt $i), retrying..."
            sleep $((i * 15))
          done
          exit 1
        env:
          FIRMWARE_VERSION: ${{ steps.version.outputs.version }}
          REMOTE_OTA_VERSION_URL: ${{ steps.version.outputs.gl_s10_ota_url }}

      - name: Prepare Artifacts
        run: |
          mkdir release
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin release/
          cp .pio/build/esp32-s3-devkitc-1/bootloader.bin release/
          cp .pio/build/esp32-s3-devkitc-1/partitions.bin release/
          cp .pio/build/esp32-s3-devkitc-1/ota_data_initial.bin release/
          mkdir release/gl-s10
          for f in firmware bootloader partitions ota_data_initial; do
            cp .pio/build/gl-s10/$f.bin release/gl-s10/
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.version.outputs.version }}
          path: release/

      - name: Name GL-S10 release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir release-files
          cp release/*.bin release-files/
          for f in release/gl-s10/*.bin; do
            cp "$f" "release-files/gl-s10-$(basename "$f")"
          done

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          make_latest: true

  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.build.outputs.version }}
          path: release

      - name: Prepare GitHub Pages
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES_BASE="https://${OWNER}.github.io/${REPO}"

          git fetch origin gh-pages --depth=1 || true

          # write_version <dir> <pages url of dir>: version.json with the previous build kept
          write_version() {
            local dir="$1" base="$2" prev_version="none" prev_size="0"
            if git cat-file -e "origin/gh-pages:${dir}firmware.bin" 2>/dev/null; then
              git show "origin/gh-pages:${dir}firmware.bin" > "docs/${dir}firmware-previous.bin"
              prev_size=$(stat --printf="%s" "docs/${dir}firmware-previous.bin")
              if git cat-file -e "origin/gh-pages:${dir}version.json" 2>/dev/null; then
                prev_version=$(git show "origin/gh-pages:${dir}version.json" | grep -o '"version"[^,]*' | cut -d'"' -f4 || echo "none")
              fi
            fi
            local size=$(stat --printf="%s" "docs/${dir}firmware.bin")
            cat > "docs/${dir}version.json" << JSON
          {
            "version": "${VERSION}",
            "size": ${size},
            "url": "${base}/firmware.bin",
            "previous_version": "${prev_version}",
            "previous_size": ${prev_size},
            "previous_url": "${base}/firmware-previous.bin"
          }
          JSON
          }

          cp release/*.bin docs/
          mkdir -p docs/gl-s10
          cp release/gl-s10/*.bin docs/gl-s10/
          write_version "" "${PAGES_BASE}"
          write_version "gl-s10/" "${PAGES_BASE}/gl-s10"
          touch docs/.nojekyll
          sed -i "s|https://github.com/mccahan/esp32-wifi-bridge|https://github.com/${OWNER}/${REPO}|g" docs/index.html

          cat > docs/manifest.json << EOF
          {
            "name": "ESP32 WiFi Bridge",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [{
              "chipFamily": "ESP32-S3",
              "parts": [
                {"path": "bootloader.bin", "offset": 0},
                {"path": "partitions.bin", "offset": 32768},
                {"path": "ota_data_initial.bin", "offset": 61440},
                {"path": "firmware.bin", "offset": 131072}
              ]
            }, {
              "chipFamily": "ESP32",
              "parts": [
                {"path": "gl-s10/bootloader.bin", "offset": 4096},
                {"path": "gl-s10/partitions.bin", "offset": 32768},
                {"path": "gl-s10/ota_data_initial.bin", "offset": 61440},
                {"path": "gl-s10/firmware.bin", "offset": 131072}
              ]
            }]
          }
          EOF

      - name: Mirror site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
