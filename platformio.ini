; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds the S3 board; `pio run -e gl-s10` the GL-S10
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
; Pin to stable platform version (ESP-IDF 5.3.1)
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = partitions.csv

; GL.iNet GL-S10: original ESP32 (4 MB flash), internal EMAC + IP101 PHY.
; Target-specific settings are in sdkconfig.defaults.esp32.
[env:gl-s10]
platform = espressif32@6.9.0
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 240000000L
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
